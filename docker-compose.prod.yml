version: '3.8'

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/animestreamer
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A jobs worker --loglevel=info
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/animestreamer
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=animestreamer
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
