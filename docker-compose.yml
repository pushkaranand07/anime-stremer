version: '3.9'

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "5000:8000"  # Expose Django on port 5000 externally for the frontend
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/animestreamer
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_logs:/app/logs
    networks:
      - animestream-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=animestreamer
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - animestream-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animestreamer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - animestream-network

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - animestream-network

networks:
  animestream-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_logs:
